name: Backtest lab (sets the official rules)

# Walk-forward backtest of spreads and totals vs closing AND opening lines,
# edge tiers by season, props accuracy. Writes docs/data/lab.json, which the
# dashboard's edge keys read. Run after the first data pull, then whenever
# the model changes. Also runs when this file is pushed.
on:
  workflow_dispatch:
    inputs:
      compare:
        description: "Also test the other feature sets (writes docs/data/feature_test.json; about 3x longer)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [".github/workflows/backtest_lab.yml"]

permissions:
  contents: write

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: cbbd-raw-v2-${{ github.run_id }}
          restore-keys: cbbd-raw-v2-
      - name: Fetch 4 past seasons + this one
        run: |
          CUR=$(python -c "import config; print(config.current_season())")
          python scripts/fetch_historical_data.py --seasons $((CUR-4)) $((CUR-3)) $((CUR-2)) $((CUR-1)) $CUR
      - uses: actions/cache/save@v4
        with:
          path: data/raw
          key: cbbd-raw-v2-${{ github.run_id }}
      - run: python scripts/build_features.py
      - run: python scripts/run_backtest.py ${{ inputs.compare && '--compare' || '' }}
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/lab.json docs/data/lab_detail.csv docs/data/feature_test.json 2>/dev/null || true; git add docs/data/lab.json docs/data/lab_detail.csv
          git diff --cached --quiet && exit 0
          git commit -m "Backtest lab results [skip ci]"
          git fetch origin main && git merge -X ours --no-edit origin/main -m "Merge [skip ci]" && git push origin main
