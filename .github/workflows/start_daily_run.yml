name: Start the daily run now

# Pushing a change to this file starts the daily run (for sessions that can
# push but can't press "Run workflow"). Also runnable from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/start_daily_run.yml"]

permissions:
  actions: write

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run daily_run.yml --repo "${{ github.repository }}" --ref main
