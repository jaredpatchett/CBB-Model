name: Daily CBB model run

# Fetch -> features -> train -> today's lines -> export -> dashboard -> alerts.
# Twice a day in season: 15:07 UTC (8am Arizona, overnight lines) and
# 21:07 UTC (2pm Arizona, props usually post the day of the game).
# data/raw is cached between runs (past seasons once; the current season is
# topped up with only the last few days of box scores each run).
on:
  workflow_dispatch:
  schedule:
    - cron: "7 15 * 11,12,1,2,3,4 *"
    - cron: "7 21 * 11,12,1,2,3,4 *"

permissions:
  contents: write

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Restore saved data
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: cbbd-raw-${{ github.run_id }}
          restore-keys: cbbd-raw-

      - name: Fetch data (past 3 seasons cached + this season)
        run: |
          CUR=$(python -c "import config; print(config.current_season())")
          python scripts/fetch_historical_data.py --seasons $((CUR-3)) $((CUR-2)) $((CUR-1)) $CUR

      - name: Save data for the next run
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: cbbd-raw-${{ github.run_id }}

      - run: python scripts/build_features.py
      - run: python scripts/train_models.py
      - run: python scripts/fetch_current_lines.py
      - run: python scripts/export_dashboard_data.py
      - run: python scripts/build_dashboard.py

      - name: Commit dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update dashboard [skip ci]"
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git merge -X ours --no-edit origin/main -m "Merge origin/main [skip ci]" && git push origin main; then break; fi
            [ "$i" -eq 5 ] && exit 1
            sleep $((RANDOM % 10 + 5))
          done

      - name: Phone alerts
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/push_alerts.py || true
