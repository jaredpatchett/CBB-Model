name: Phone alerts test
on: workflow_dispatch
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/push_alerts.py --test
